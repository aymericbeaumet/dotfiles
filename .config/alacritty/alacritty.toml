[general]
live_config_reload = true

[colors.bright]
black = "0x4C566A"
blue = "0x81A1C1"
cyan = "0x8FBCBB"
green = "0xA3BE8C"
magenta = "0xB48EAD"
red = "0xBF616A"
white = "0xECEFF4"
yellow = "0xEBCB8B"

[colors.normal]
black = "0x3B4252"
blue = "0x81A1C1"
cyan = "0x88C0D0"
green = "0xA3BE8C"
magenta = "0xB48EAD"
red = "0xBF616A"
white = "0xE5E9F0"
yellow = "0xEBCB8B"

[colors.primary]
background = "0x2E3440"
foreground = "0xD8DEE9"

[font]
size = 13

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[font.bold_italic]
family = "FiraCode Nerd Font"
style = "Bold Italic"

[[keyboard.bindings]]
action = "Copy"
key = "Copy"

[[keyboard.bindings]]
chars = "\u007F"
key = "Back"

[[keyboard.bindings]]
chars = """

"""
key = "NumpadEnter"

[[keyboard.bindings]]
chars = "\u0000"
key = "Space"
mods = "Control"

[[keyboard.bindings]]
chars = "\u0011"
key = "Q"
mods = "Control"

# Shifted arrows through the Unix chords. Karabiner rewrites Ctrl-B/F/N/P to
# arrows everywhere except Alacritty, where Ctrl-B is the tmux prefix. The
# Shift variants are unused in the terminal, so send xterm Shift+arrow
# sequences that tmux forwards to TUIs such as Codex and Claude.
[[keyboard.bindings]]
chars = "\u001b[1;2D"
key = "B"
mods = "Control|Shift"

[[keyboard.bindings]]
chars = "\u001b[1;2C"
key = "F"
mods = "Control|Shift"

[[keyboard.bindings]]
chars = "\u001b[1;2B"
key = "N"
mods = "Control|Shift"

[[keyboard.bindings]]
chars = "\u001b[1;2A"
key = "P"
mods = "Control|Shift"

# Disable Alacritty's built-in macOS Command shortcuts. Tmux window selection
# below is terminal-native; Flash remains responsible for cross-terminal jumps.
[[keyboard.bindings]]
action = "None"
key = "K"
mods = "Command"
mode = "~Vi|~Search"

[[keyboard.bindings]]
action = "None"
key = "0"
mods = "Command"

[[keyboard.bindings]]
action = "None"
key = "="
mods = "Command"

[[keyboard.bindings]]
action = "None"
key = "+"
mods = "Command"

[[keyboard.bindings]]
action = "None"
key = "NumpadAdd"
mods = "Command"

[[keyboard.bindings]]
action = "None"
key = "-"
mods = "Command"

[[keyboard.bindings]]
action = "None"
key = "NumpadSubtract"
mods = "Command"

[[keyboard.bindings]]
action = "None"
key = "C"
mods = "Command"

[[keyboard.bindings]]
action = "None"
key = "C"
mods = "Command"
mode = "Vi|~Search"

[[keyboard.bindings]]
action = "None"
key = "H"
mods = "Command"

[[keyboard.bindings]]
action = "None"
key = "H"
mods = "Command|Alt"

[[keyboard.bindings]]
action = "None"
key = "M"
mods = "Command"

# Cmd+W kills the tmux pane. Cmd+Shift+W closes the single window, which
# quits Alacritty, and Cmd+Q quits too; the scratch session survives both.
[[keyboard.bindings]]
chars = "\u0011x"
key = "W"
mods = "Command"

[[keyboard.bindings]]
action = "Quit"
key = "W"
mods = "Command|Shift"

[[keyboard.bindings]]
action = "Quit"
key = "Q"
mods = "Command"

[[keyboard.bindings]]
action = "None"
key = "N"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0011c"
key = "T"
mods = "Command"

# Detach the tmux client; scripts/scratch-terminal.sh reattaches immediately,
# which reloads the tmux configuration and resets the client state.
[[keyboard.bindings]]
chars = "\u0011d"
key = "R"
mods = "Command"

[[keyboard.bindings]]
action = "None"
key = "F"
mods = "Command|Control"

[[keyboard.bindings]]
action = "None"
key = "F"
mods = "Command"
mode = "~Search"

[[keyboard.bindings]]
action = "None"
key = "B"
mods = "Command"
mode = "~Search"

[[keyboard.bindings]]
action = "None"
key = "Tab"
mods = "Command"

[[keyboard.bindings]]
action = "None"
key = "Tab"
mods = "Command|Shift"

# Route native macOS tab, pane, and split shortcuts through tmux. Depending on
# the active keyboard layout, Alacritty can report shifted brackets as either
# the base bracket or the resulting brace, so bind both forms.
[[keyboard.bindings]]
chars = "\u0011p"
key = "["
mods = "Command|Shift"

[[keyboard.bindings]]
chars = "\u0011p"
key = "{"
mods = "Command|Shift"

[[keyboard.bindings]]
chars = "\u0011n"
key = "]"
mods = "Command|Shift"

[[keyboard.bindings]]
chars = "\u0011n"
key = "}"
mods = "Command|Shift"

[[keyboard.bindings]]
chars = "\u0011O"
key = "["
mods = "Command"

[[keyboard.bindings]]
chars = "\u0011o"
key = "]"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0011v"
key = "D"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0011s"
key = "D"
mods = "Command|Shift"

[[keyboard.bindings]]
chars = "\u0011\u0031"
key = "1"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0011\u0032"
key = "2"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0011\u0033"
key = "3"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0011\u0034"
key = "4"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0011\u0035"
key = "5"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0011\u0036"
key = "6"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0011\u0037"
key = "7"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0011\u0038"
key = "8"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0011\u0039"
key = "9"
mods = "Command"

# Shift-click: URLs → browser, images → Preview, text → nvim tmux popup
[[hints.enabled]]
regex = "https?://[\\w./\\-?&=@%+:~#!$,;*()]+[\\w/]|\\$\\{?\\w+\\}?(?:/[\\w./\\-]+)+|(?:~|/)[^\\s\\]\\r\\n][^\\s\\]\\r\\n]*\\.[\\w-]+(?:/[^\\s\\]\\r\\n]+)*(?::\\d+(?::\\d+)?)?|(?:\\.{1,2}/)[^\\s\\]\\r\\n][^\\s\\]\\r\\n]*\\.[\\w-]+(?:/[^\\s\\]\\r\\n]+)*(?::\\d+(?::\\d+)?)?|[\\w.@\\-]+(?:/[^\\s\\]\\r\\n][^\\s\\]\\r\\n]*)+\\.[\\w-]+(?:/[^\\s\\]\\r\\n]+)*(?::\\d+(?::\\d+)?)?|[\\w.@\\-]+\\.[\\w-]+(?::\\d+(?::\\d+)?)?|(?-u:\\b)E\\d{4}(?-u:\\b)"
hyperlinks = true
mouse = { enabled = true, mods = "Shift" }
command = { program = "sh", args = ["-c", "exec \"$HOME/.dotfiles/scripts/open-hint.sh\" \"$@\"", "open-hint"] }
post_processing = true

[mouse]
hide_when_typing = false

[[mouse.bindings]]
action = "ReceiveChar"
mouse = "Right"

[scrolling]
# Scratch runs inside tmux, which owns scrollback for inline programs and
# forwards wheel events to TUIs that enable native mouse tracking.
history = 0

[selection]
# Tmux selections copy through scripts/clip.sh; avoid a second AppKit write.
save_to_clipboard = false

# Use a login shell so Dock launches inherit Homebrew and mise, then keep the
# single window attached to the local scratch session.
[terminal.shell]
program = "/bin/zsh"
args = ["-l", "-c", "exec \"$HOME/.dotfiles/scripts/scratch-terminal.sh\""]

[window]
decorations = "None"
dynamic_title = false
padding = { x = 0, y = 0 }
dynamic_padding = true
startup_mode = "Maximized"
title = "scratch@macbook"
option_as_alt = "Both"
opacity = 1
blur = true
