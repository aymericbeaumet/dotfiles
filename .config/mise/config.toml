[settings]
# Keep the shell prompt offline without going offline everywhere. The prompt
# cost came from mise's precmd `hook-env` trying to auto-install missing tools —
# resolving `= "latest"` against api.github.com on every prompt. Disabling only
# passive auto-install keeps prompts instant and network-free, while real work
# still hits the network: tools install on demand when you actually run them
# (exec_auto_install / not_found_auto_install stay on) and `mise install` /
# `mise use` work normally.
auto_install = false

[tools]
"aqua:dalance/procs" = "latest"
"aqua:docker/buildx" = "latest"
"aqua:scaleway/scaleway-cli" = "latest"
actionlint = "1.7.12"
awscli = "latest"
bat = "latest"
bottom = "latest"
buf = "1.69.0"
bun = "latest"
carapace = "latest"
cmake = "latest"
coreutils = "latest"
delta = "latest"
docker-cli = "latest"
docker-compose = "latest"
dust = "latest"
eza = "latest"
fd = "latest"
ffmpeg = "latest"
fzf = "latest"
gh = "latest"
git-lfs = "latest"
glow = "latest"
go = "1.25"
gradle = "latest"
grok = "latest"
jq = "latest"
lazygit = "latest"
lnav = "latest"
neovim = "latest"
node = "26.0.0"
opentofu = "1.12.2"
"pipx:semble" = { version = "0.5.4", uvx = true }
protoc = "34.1"
ripgrep = "latest"
rtk = "latest"
rust = "latest"
sd = "latest"
shellcheck = "0.11.0"
shfmt = "3.13.1"
stripe = "1.55.12"
stylua = "2.5.2"
taplo = "0.10.0"
terraform = "1.14.3"
tmux = "latest"
tree-sitter = "latest"
# The release contains both thumbs and its tmux driver; macOS uses Rosetta.
"github:fcsonline/tmux-thumbs" = { version = "0.8.0", platforms.macos-arm64.asset_pattern = "tmux-thumbs_{{ version }}_x86_64-apple-darwin.zip" }
uv = "0.11.15"
watchexec = "latest"
websocat = "latest"
yq = "4.53.3"
zoxide = "latest"
"npm:@anthropic-ai/claude-code" = "latest"
"npm:@openai/codex" = "latest"
"npm:ccusage" = "latest"
"npm:greptile" = "latest"
"npm:tokscale" = "4.17.0"
"npm:vercel" = "latest"
"npm:wrangler" = "latest"
zig = "latest"

[tools."http:f3"]
version = "10.0"
# The Linux bottle requires Homebrew's runtime linker.
os = ["macos/arm64"]
url = "https://ghcr.io/v2/homebrew/core/f3/blobs/sha256:2a1fa8a2cbf80773e1709d368f4a2f245af846d30bb0b974d3bd4f491b9bc07c"
checksum = "sha256:2a1fa8a2cbf80773e1709d368f4a2f245af846d30bb0b974d3bd4f491b9bc07c"
# Homebrew's public registry uses this static header for anonymous pulls.
headers = { Authorization = "Bearer QQ==" }
format = "tar.gz"
strip_components = 1
bin_path = "10.0/bin"
