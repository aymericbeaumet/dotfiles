# Capacity and I/O for visible volumes, sized for 120 columns by 24 rows.
[flags]
rate = "2s"
expanded = true
table_gap = "none"

[styles]
theme = "nord"

[disk]
columns = ["Disk", "Mount", "Used", "Free", "Total", "Used%", "R/s", "W/s"]

[disk.mount_filter]
is_list_ignored = true
list = ["^/System/Volumes/(Preboot|VM|Update|xarts|iSCPreboot|Hardware)$", "^/Library/Developer/CoreSimulator/"]
regex = true

[[row]]
[[row.child]]
type = "disk"
default = true
