# Per-core history and CPU-heavy processes, sized for 120 by 38 cells.
[flags]
rate = "2s"
retention = "10m"
table_gap = "none"
show_table_scroll_position = true

[styles]
theme = "nord"

[cpu]
default = "all"
show_decimal = true

[processes]
columns = ["PID", "Name", "CPU%", "Mem", "R/s", "W/s", "User", "State", "Time"]
default_sort = "CPU%"

[[row]]
ratio = 1
[[row.child]]
type = "cpu"
default = true

[[row]]
ratio = 1
[[row.child]]
type = "proc"
