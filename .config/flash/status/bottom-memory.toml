# Memory/swap history and memory-heavy processes, sized for 120 by 34 cells.
[flags]
rate = "2s"
retention = "10m"
table_gap = "none"
show_table_scroll_position = true

[styles]
theme = "nord"

[processes]
columns = ["PID", "Name", "Mem", "Mem%", "CPU%", "R/s", "W/s", "User", "State"]
default_sort = "Mem%"

[[row]]
ratio = 1
[[row.child]]
type = "mem"
default = true

[[row]]
ratio = 1
[[row.child]]
type = "proc"
