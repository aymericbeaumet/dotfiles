[hints]
keys = "<colemak>"

[open]
ignored_apps = ["com.flash.native-fixture", "com.flash.native-oracle", "com.flash.vimium-oracle"]

[plugin.cpu]
summary_mode = "compact"

[plugin.memory]
summary_mode = "compact"

[plugin.disks]
summary_mode = "compact"

[plugin.network]
summary_mode = "compact"

[plugin.power]
summary_mode = "compact"

[plugin.feed]
label = "AGGR"
url = "https://aggr.aymericbeaumet.com/rss.xml"
refresh_interval = 300
cycle_interval = 60

[statusbar]
enabled = true
monitor = "primary"
popup_fg = "#D8DEE9"
popup_bg = "#242933F2"
popup_border = "#4C566A"
popup_border_size = 1
popup_corner_radius = 8
popup_padding = 10
popup_max_width = 420
popup_offset = 8
template = "#[align=left]#{E:@left}#[align=absolute-centre]#{E:@centre}#[align=right]#{T:@right}"

[statusbar.options]
"@left" = """
#[pill]#{flash.mode}#[nopill]#[fg=colour245] · #[link=https://aggr.aymericbeaumet.com]#{flash.plugin.feed.summary}#[nolink]
"""
"@centre" = """
#[popup=active-app]#{=/23/…:flash.active_app_name}#[nopopup]
"""
"@right" = """
#{?flash.plugin.caffeinate.state,#[fg=#EBCB8B]AWAKE#[default] ,}
#{?flash.plugin.aiproviders.summary,#{flash.plugin.aiproviders.summary} ,}
#[fg=#EBCB8B]#[popup=cpu]CPU#[nopopup] #[popup=memory]MEM#[nopopup] #[popup=disks]DISK#[nopopup] #[popup=network]NET#[nopopup]#[default]
#{?flash.plugin.power.label, #[popup=battery]#{flash.plugin.power.label}#[nopopup],}
#[fg=colour245] · #[popup=date]#{?flash.plugin.caffeinate.state,,%a %b %-d }#[default]%H:%M#[nopopup]
"""

[statusbar.popup]
active-app = """
#[fg=#EBCB8B]#{flash.active_app_name}#[default]
#{flash.plugin.processes.focused_app_details}
"""

[flashlight]
suggestion_count = 10

[debug]
log_level = "trace"

[mode]
sequence_timeout_ms = 1000

[mode.all.mappings]
# leave insert, command, or terminal mode
"cmd+ctrl+[" = ["flash", "leave_mode"]
# enter insert mode
"cmd+ctrl+i" = ["flash", "enter_insert_mode"]
# enter command mode
"cmd+ctrl+semicolon" = ["flash", "enter_command_mode"]
# enter flashlight
"cmd+<space>" = ["flash", "enter_command_mode", "--input=:flashlight "]
"cmd+ctrl+<space>" = ["flash", "enter_command_mode", "--input=:flashlight @emojis.glyphs ", "--restore-mode"]
# window management
"alt+h" = ["flash", "window_move", "--position=lefthalf"]
"alt+j" = ["flash", "window_move", "--position=bottomhalf"]
"alt+k" = ["flash", "window_move", "--position=tophalf"]
"alt+l" = ["flash", "window_move", "--position=righthalf"]
"alt+m" = ["flash", "window_move", "--position=maximized"]
"alt+z" = ["flash", "window_move", "--x=10.6925%", "--y=10.6925%", "--width=78.615%", "--height=78.615%"]
"alt+n" = ["flash", "window_move", "--screen=+1"]
"alt+p" = ["flash", "window_move", "--screen=-1"]

[mode.normal]
leader = "<space>"
passthrough_keys = ["escape"]
passthrough_modifiers = ["cmd", "ctrl", "shift", "alt"]

[mode.normal.mappings]
"'b" = ["flash", "terminal_show", "--name=bonsai"]
# convenient utilities
"<leader>m" = ["sh", "../../scripts/toggle_mute.sh"]
"<leader>p" = ["sh", "../../scripts/toggle_play.sh"]
"<leader>s" = ["sh", "../../scripts/toggle_sleep.sh"]
# app switch chords
"'a" = ["flash", "app_open", "--name=Alacritty"]
"'c" = ["flash", "app_open", "--name=Claude"]
"'e" = ["flash", "app_open", "--name=Element"]
"'f" = ["flash", "app_open", "--name=Firefox"]
"'i" = ["flash", "app_open", "--name=Messages"]
"'l" = ["flash", "app_open", "--name=Linear"]
"'n" = ["flash", "app_open", "--name=Notes"]
"'o" = ["flash", "app_open", "--name=Notion"]
"'p" = ["flash", "app_open", "--name=Postico 2"]
"'r" = ["flash", "app_open", "--name=Reminders"]
"'s" = ["flash", "app_open", "--name=Slack"]
"'y" = ["flash", "app_open", "--name=Spotify"]
"'w" = ["flash", "app_open", "--name=WhatsApp"]

[terminal.bonsai]
command = ["bonsai", "hq", "--no-open", "--port", "0"]
persistent = true
working_directory = "~"
columns = 120
rows = 36

[terminal.cpu]
persistent = true
working_directory = "."
command = ["btm", "--config_location", "status/bottom-cpu.toml"]
columns = 92
rows = 22

[terminal.memory]
persistent = true
working_directory = "."
command = ["btm", "--config_location", "status/bottom-memory.toml"]
columns = 92
rows = 22

[terminal.disks]
persistent = true
working_directory = "."
command = ["btm", "--config_location", "status/bottom-disks.toml"]
columns = 90
rows = 16

[terminal.network]
persistent = true
working_directory = "."
command = ["btm", "--config_location", "status/bottom-network.toml"]
columns = 84
rows = 20

[terminal.battery]
working_directory = "."
persistent = true
command = ["btm", "--config_location", "status/bottom-battery.toml"]
columns = 52
rows = 12

[terminal.date]
working_directory = "."
persistent = true
command = ["calcurse", "--read-only", "--quiet", "-D", "status/calcurse", "-C", "status/calcurse"]
columns = 74
rows = 22
