[hints]
keys = "<colemak>"

[flashlight]
ignored_apps = ["com.flash.native-fixture", "com.flash.native-oracle", "com.flash.vimium-oracle"]
suggestion_count = 10

[debug]
log_level = "trace"

[statusbar]
enabled = true
monitor = "primary"
template = """
#[align=left]#[pill]#{flash.mode}#[nopill]#[fg=colour245] · #[popup=feed]#[link=https://aggr.aymericbeaumet.com]#{flash.plugin.feed.label}#[nolink]#[nopopup]
#[align=absolute-centre]#[popup=active-app]#[shrink]#{flash.active_app_name}#[noshrink]#[nopopup]
#[align=right]#[popup=ai-usage]#[link=https://claude.ai/new#settings/usage]#{flash.plugin.aiproviders.claude_label}#[nolink] #[link=https://chatgpt.com/settings/usage?tab=overview]#{flash.plugin.aiproviders.codex_label}#[nolink]#[nopopup]
#[fg=colour245] · #[popup=docker]#[fg=#EBCB8B]DKR#[default] #[fg=colour245]#{flash.source.docker}#[default]#[nopopup]
#[fg=colour245] · #[popup=btop]#{flash.plugin.cpu.label} #{flash.plugin.memory.label} #{flash.plugin.disks.label} #{flash.plugin.network.label} #{flash.plugin.power.label}#[nopopup]
#[fg=colour245] · #[popup=date]%a %b %-d #[default]%H:%M#[nopopup]
"""

# Running-container count. This round-trips to the Colima VM, so it runs on its
# own interval as a named source rather than re-running with every render of the
# bar. The script resolves the mise-managed Docker CLI, which is not on the PATH
# a GUI app inherits.
[statusbar.sources.docker]
command = ["~/.dotfiles/scripts/docker-status.sh", "count"]
interval = 30

[mode]
scroll_step_lines = 3
scroll_page_lines = 20
sequence_timeout_ms = 1000

[mode.all.mappings]
# enter normal mode
"cmd+ctrl+[" = ["flash", "enter_normal_mode"]
# enter insert mode
"cmd+ctrl+i" = ["flash", "enter_insert_mode"]
# enter command mode
"cmd+ctrl+semicolon" = ["flash", "enter_command_mode"]
# enter flashlight
"cmd+<space>" = ["flash", "enter_command_mode", "--input=:flashlight "]
"cmd+ctrl+<space>" = ["flash", "enter_command_mode", "--input=:flashlight @emojis.glyphs ", "--restore-mode"]
# open the terminal popup
"alt+space" = ["flash", "enter_terminal_mode"]
# window management
"alt+h" = ["flash", "window_move", "--position=lefthalf"]
"alt+j" = ["flash", "window_move", "--position=bottomhalf"]
"alt+k" = ["flash", "window_move", "--position=tophalf"]
"alt+l" = ["flash", "window_move", "--position=righthalf"]
"alt+m" = ["flash", "window_move", "--position=maximized"]
"alt+z" = ["flash", "window_move", "--x=10.6925%", "--y=10.6925%", "--width=78.615%", "--height=78.615%"]
"alt+n" = ["flash", "window_move", "--screen=+1"]
"alt+p" = ["flash", "window_move", "--screen=-1"]

[mode.normal]
leader = "<space>"

[mode.normal.mappings]
# app switch chords
"'a" = ["flash", "app_open", "--name=Alacritty"]
"'b" = ["flash", "enter_terminal_mode", "--name=bonsai"]
"'c" = ["flash", "app_open", "--name=Claude"]
"'e" = ["flash", "app_open", "--name=Element"]
"'f" = ["flash", "app_open", "--name=Firefox"]
"'i" = ["flash", "app_open", "--name=Messages"]
"'l" = ["flash", "app_open", "--name=Linear"]
"'n" = ["flash", "app_open", "--name=Notes"]
"'p" = ["flash", "app_open", "--name=Postico 2"]
"'r" = ["flash", "app_open", "--name=Reminders"]
"'s" = ["flash", "app_open", "--name=Slack"]
"'y" = ["flash", "app_open", "--name=Spotify"]
"'w" = ["flash", "app_open", "--name=WhatsApp"]
# convenient utilities
"<leader>p" = ["../../scripts/toggle_play.sh"]
# Flash's own caffeinate plugin owns the sleep assertion: it holds -dimsu for
# as long as it lives and ties it to the plugin with -w, so nothing keeps the
# Mac awake unowned. The state it publishes is no longer drawn in the bar;
# `flash caffeinate` reports it when the toggle's effect is in question.
#
# Spawned through env rather than written as a bare `["flash", …]` verb: config
# validation only resolves built-in verbs, deliberately, so that a stale verb
# fails loudly instead of becoming a silent no-op plugin call. Plugin verbs
# reach the plugin over the AppleEvent path, which is what the binary uses.
"<leader>s" = ["/usr/bin/env", "flash", "caffeinate_toggle"]
# karabiner system-wide remap
"<delete_forward>" = ["flash", "scroll_half_page_down"]            # Ctrl-D
"cmd+<right>" = ["flash", "scroll_down"]                           # Ctrl-E
"cmd+<delete>" = ["flash", "scroll_half_page_up"]                  # Ctrl-U
"<tab>" = ["flash", "movement_forward"]                            # Ctrl-I
"<right>" = ["flash", "mouse_grid"]                                # Ctrl-F
"shift+<right>" = ["flash", "mouse_grid", "--modifiers=cmd+shift"] # Ctrl-Shift-F

[popup]
bg = "#242933F2"
padding = 10

[popup.date]
text = "#{flash.calendar}"

[popup.active-app]
text = """
#[fg=#EBCB8B]#{flash.active_app_name}#[default]
#{flash.plugin.processes.focused_app_details}
"""

# AI usage from tokscale's own TUI (installed through mise): tokens and cost by
# day and model, subscription quotas under Usage. It stays resident and refreshes
# itself every five minutes (tokscale's autoRefresh setting); r refreshes now.
[popup.ai-usage]
command = ["tokscale"]
size = "140x40"
persistent = true

# The container table behind the DKR label. A plain `docker ps` snapshot, taken
# when the popup is shown; the same script explains a stopped Colima in place.
# A terminal popup rather than a text one: `#()` keeps only its latest line, so
# a text popup reported a single container however many were running.
#
# It redraws itself on a timer and is resident, which is the shape the popup
# docs recommend for a view that has one. A report that simply exits is the
# obvious alternative, but it closed the moment it was hovered, and holding it
# open with `cat` instead froze the prewarmed snapshot taken at Flash start and
# kept the blank rows, since only a finished screen is trimmed to its output.
# `size` matches what the renderer draws: 100 columns and a header, a row per
# container and a footer, with a little headroom.
[popup.docker]
command = ["~/.dotfiles/scripts/docker-status.sh", "watch"]
persistent = true
size = "102x20"

# One resident system monitor behind every system label.
[popup.btop]
command = ["btop"]
size = "90%x85%"
persistent = true

[popup.bonsai]
command = ["bonsai", "hq", "--no-open", "--port", "0"]
cwd = "~"
size = "120x36"
persistent = true

[popup.feed]
command = [
  "sh",
  "-c",
  "exec ~/.dotfiles/scripts/newsboat.sh \"$@\"",
  "newsboat",
  "-u",
  "../newsboat/urls",
  "-C",
  "../newsboat/config",
  "-c",
  "~/.cache/newsboat/flash-feed.db",
]
cwd = "."
size = "100x30"
persistent = true

[plugin.feed]
label = "aggr"
url = "https://aggr.aymericbeaumet.com/rss.xml"
refresh_interval = 300
cycle_interval = 30
