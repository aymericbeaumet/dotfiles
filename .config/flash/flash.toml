[hints]
keys = "<colemak>"

[open]
ignored_apps = ["com.flash.native-fixture", "com.flash.native-oracle", "com.flash.vimium-oracle"]

[plugin.cpu]
summary_mode = "compact"

[plugin.memory]
summary_mode = "compact"

[plugin.disks]
summary_mode = "compact"

[plugin.network]
summary_mode = "compact"

[plugin.power]
summary_mode = "compact"

[statusbar]
enabled = true
monitor = "primary"
popup_fg = "#D8DEE9"
popup_bg = "#242933F2"
popup_border = "#4C566A"
popup_border_size = 1
popup_corner_radius = 8
popup_padding = 10
popup_max_width = 420
popup_offset = 8
template = """
#[align=left]#{mode}#[fg=colour245] · #[link=https://news.ycombinator.com]#[fg=colour178]HN#[fg=colour245]#[nolink] #{cycle:../../scripts/hn-top-stories.sh}

#[align=center]#[popup=active-app]#{=24…:active_app_name}#[nopopup]

#[align=right]
#[popup=ai]#[fg=colour178]AI#[fg=colour245] #[link=https://claude.ai/new#settings/usage]C#{s/↻[^# ]+//:plugin:aiproviders.claude_usage} F#{s/↻[^# ]+//:plugin:aiproviders.fable_usage}#[nolink] #[link=https://chatgpt.com/codex/cloud/settings/analytics#usage]O#{s/↻[^# ]+//:plugin:aiproviders.codex_usage}#[nolink] #[link=https://grok.com/?_s=usage]G#{s/↻[^# ]+//:script:../../scripts/agent-quota-status.sh --grok}#[nolink]#[nopopup]
#[fg=colour245] · #{plugin:cpu.summary}
#[fg=colour245] · #{plugin:memory.summary}
#[fg=colour245] · #{plugin:disks.summary}
#[fg=colour245] · #{plugin:network.summary}
#[fg=colour245] · #{plugin:power.summary}
#[fg=colour245] · #[popup=date]#{date}#[nopopup]
"""

[statusbar.popup]
active-app = """
#[fg=colour178,bold]#{active_app_name}#[default]
#{plugin:processes.focused_app_details}
"""
ai = """
#[fg=colour178,bold]AI usage#[default]
#[fg=colour178,bold]Claude#[default]
#{plugin:aiproviders.claude_usage_details}

#[fg=colour178,bold]Fable#[default]
#{plugin:aiproviders.fable_usage_details}

#[fg=colour178,bold]Codex#[default]
#{plugin:aiproviders.codex_usage_details}

#[fg=colour178,bold]Grok#[default]
#{script=5:../../scripts/agent-quota-status.sh --details=grok}
"""
date = """
#[fg=colour178,bold]%A, %-d %B %Y#[default]
%H:%M %Z (UTC%z)
ISO week %V of %G · day %j
"""

[flashlight]
suggestion_count = 10

[debug]
log_level = "trace"

[mode]
sequence_timeout_ms = 1000

[mode.all.mappings]
# enter normal mode
"cmd+ctrl+[" = ["flash", "enter_normal_mode"]
"cmd+escape" = ["flash", "enter_normal_mode"]
# enter command mode
"cmd+shift+colon" = ["flash", "enter_command_mode"]
"cmd+ctrl+semicolon" = ["flash", "enter_command_mode"]
# enter flashlight
"cmd+<space>" = ["flash", "enter_command_mode", "--input=:flashlight "]
"cmd+ctrl+<space>" = ["flash", "enter_command_mode", "--input=:flashlight @emojis.glyphs ", "--restore-mode"]
# window management
"alt+h" = ["flash", "window_move", "--position=lefthalf"]
"alt+j" = ["flash", "window_move", "--position=bottomhalf"]
"alt+k" = ["flash", "window_move", "--position=tophalf"]
"alt+l" = ["flash", "window_move", "--position=righthalf"]
"alt+m" = ["flash", "window_move", "--position=maximized"]
"alt+n" = ["flash", "window_move", "--screen=+1"]
"alt+p" = ["flash", "window_move", "--screen=-1"]

[mode.normal]
leader = "<space>"
passthrough_keys = ["escape"]
passthrough_modifiers = ["cmd", "ctrl", "shift", "alt"]

[mode.normal.mappings]
# window management
"alt+z" = ["flash", "window_move", "--x=10.6925%", "--y=10.6925%", "--width=78.615%", "--height=78.615%"]
# convenient utilities
"<leader>l" = ["sh", "-c", "shortcuts run log && flash window_move --position=center"]
"<leader>m" = ["sh", "../../scripts/toggle_mute.sh"]
"<leader>p" = ["sh", "../../scripts/toggle_play.sh"]
"<leader>s" = ["sh", "../../scripts/toggle_sleep.sh"]
"<leader>w" = ["sh", "../../scripts/toggle_wifi.sh"]
# app switch chords
"'a" = ["flash", "app_open", "--name=Alacritty"]
"'c" = ["flash", "app_open", "--name=Claude"]
"'e" = ["flash", "app_open", "--name=Element"]
"'f" = ["flash", "app_open", "--name=Firefox"]
"'i" = ["flash", "app_open", "--name=Messages"]
"'l" = ["flash", "app_open", "--name=Linear"]
"'n" = ["flash", "app_open", "--name=Notes"]
"'o" = ["flash", "app_open", "--name=Notion"]
"'p" = ["flash", "app_open", "--name=Postico 2"]
"'r" = ["flash", "app_open", "--name=Reminders"]
"'s" = ["flash", "app_open", "--name=Slack"]
"'y" = ["flash", "app_open", "--name=Spotify"]
"'w" = ["flash", "app_open", "--name=WhatsApp"]
