[hints]
keys = "<colemak>"

[flashlight]
ignored_apps = ["com.flash.native-fixture", "com.flash.native-oracle", "com.flash.vimium-oracle"]
suggestion_count = 10

[debug]
log_level = "trace"

[statusbar]
enabled = true
monitor = "primary"
template = """
#[align=left]#[pill]#{flash.mode}#[nopill]#[fg=colour245] · #[popup=feed]#[link=https://aggr.aymericbeaumet.com]#{flash.plugin.feed.label}#[nolink]#[nopopup]
#[align=absolute-centre]#[popup=active-app]#{=/23/…:flash.active_app_name}#[nopopup]
#[align=right]#{?flash.plugin.caffeinate.state,#[fg=#EBCB8B]AWAKE#[default] ,}
#[popup=ai-usage]#[link=https://claude.ai/settings/usage]#{flash.plugin.aiproviders.claude_label}#[nolink] #[link=https://chatgpt.com/codex/settings/usage]#{flash.plugin.aiproviders.codex_label}#[nolink]#[nopopup]
#[fg=colour245] · #[popup=btop]#{flash.plugin.cpu.label} #{flash.plugin.memory.label} #{flash.plugin.disks.label} #{flash.plugin.network.label} #{flash.plugin.power.label}#[nopopup]
#[fg=colour245] · #[popup=date]#{?flash.plugin.caffeinate.state,,%a %b %-d }#[default]%H:%M#[nopopup]
"""

[mode]
scroll_step_lines = 3
scroll_page_lines = 20
sequence_timeout_ms = 1000

[mode.all.mappings]
# enter normal mode
"cmd+ctrl+[" = ["flash", "enter_normal_mode"]
# enter insert mode
"cmd+ctrl+i" = ["flash", "enter_insert_mode"]
# enter command mode
"cmd+ctrl+semicolon" = ["flash", "enter_command_mode"]
# enter flashlight
"cmd+<space>" = ["flash", "enter_command_mode", "--input=:flashlight "]
"cmd+ctrl+<space>" = ["flash", "enter_command_mode", "--input=:flashlight @emojis.glyphs ", "--restore-mode"]
# open the terminal popup
"alt+space" = ["flash", "enter_terminal_mode"]
# window management
"alt+h" = ["flash", "window_move", "--position=lefthalf"]
"alt+j" = ["flash", "window_move", "--position=bottomhalf"]
"alt+k" = ["flash", "window_move", "--position=tophalf"]
"alt+l" = ["flash", "window_move", "--position=righthalf"]
"alt+m" = ["flash", "window_move", "--position=maximized"]
"alt+z" = ["flash", "window_move", "--x=10.6925%", "--y=10.6925%", "--width=78.615%", "--height=78.615%"]
"alt+n" = ["flash", "window_move", "--screen=+1"]
"alt+p" = ["flash", "window_move", "--screen=-1"]

[mode.normal]
leader = "<space>"

[mode.normal.mappings]
# app switch chords
"'a" = ["flash", "app_open", "--name=Alacritty"]
"'b" = ["flash", "enter_terminal_mode", "--name=bonsai"]
"'c" = ["flash", "app_open", "--name=Claude"]
"'e" = ["flash", "app_open", "--name=Element"]
"'f" = ["flash", "app_open", "--name=Firefox"]
"'i" = ["flash", "app_open", "--name=Messages"]
"'l" = ["flash", "app_open", "--name=Linear"]
"'n" = ["flash", "app_open", "--name=Notes"]
"'p" = ["flash", "app_open", "--name=Postico 2"]
"'r" = ["flash", "app_open", "--name=Reminders"]
"'s" = ["flash", "app_open", "--name=Slack"]
"'y" = ["flash", "app_open", "--name=Spotify"]
"'w" = ["flash", "app_open", "--name=WhatsApp"]
# convenient utilities
"<leader>p" = ["../../scripts/toggle_play.sh"]
"<leader>s" = ["../../scripts/toggle_sleep.sh"]
# karabiner system-wide remap
"<delete_forward>" = ["flash", "scroll_half_page_down"]            # Ctrl-D
"cmd+<right>" = ["flash", "scroll_down"]                           # Ctrl-E
"cmd+<delete>" = ["flash", "scroll_half_page_up"]                  # Ctrl-U
"<tab>" = ["flash", "movement_forward"]                            # Ctrl-I
"<right>" = ["flash", "mouse_grid"]                                # Ctrl-F
"shift+<right>" = ["flash", "mouse_grid", "--modifiers=cmd+shift"] # Ctrl-Shift-F

[popup]
bg = "#242933F2"
padding = 10

[popup.date]
text = "#{flash.calendar}"

[popup.active-app]
text = """
#[fg=#EBCB8B]#{flash.active_app_name}#[default]
#{flash.plugin.processes.focused_app_details}
"""

# Claude and Codex subscription quotas from tokscale (installed through mise),
# rerun every five minutes so hovering is instant; Cmd-R in the popup reruns it.
[popup.ai-usage]
command = ["sh", "-c", 'while :; do report=$(tokscale usage 2>&1); clear; printf "%s\n" "$report"; sleep 300; done']
size = "68x16"
persistent = true

# One resident system monitor behind every system label.
[popup.btop]
command = ["btop"]
size = "90%x85%"
persistent = true

[popup.bonsai]
command = ["bonsai", "hq", "--no-open", "--port", "0"]
cwd = "~"
size = "120x36"
persistent = true

[popup.feed]
command = [
  "sh",
  "-c",
  "exec ~/.dotfiles/scripts/newsboat.sh \"$@\"",
  "newsboat",
  "-u",
  "../newsboat/urls",
  "-C",
  "../newsboat/config",
  "-c",
  "~/.cache/newsboat/flash-feed.db",
]
cwd = "."
size = "100x30"
persistent = true

[plugin.feed]
label = "aggr"
url = "https://aggr.aymericbeaumet.com/rss.xml"
refresh_interval = 300
cycle_interval = 30
